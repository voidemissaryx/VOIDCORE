name: Android CI
run-name: VOIDCORE 1.5.1 · Android test and APK build

on:
  workflow_dispatch:
  push:
    branches:
      - default
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'scanner/**'
      - 'scripts/**'
      - 'worker/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Validate bundled scanner CIDRs
        working-directory: scanner
        run: go run ./cmd/normalize_scanner_cidrs --check ../assets/scanner

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Psiphon exit
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: bash scripts/build_psiphon.sh

      - name: Tor and lyrebird
        run: bash scripts/fetch_tor.sh

      - name: Xray core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: bash scripts/build_xray.sh

      - name: Free Go build cache
        run: go clean -cache -modcache

      - name: Routing data
        run: bash scripts/fetch_geo.sh

      - name: Minify worker
        working-directory: worker
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run minify

      - name: Tor bridges
        run: bash scripts/fetch_tor_bridges.sh

      - run: flutter pub get --enforce-lockfile

      - name: Flutter tests
        run: flutter test --no-pub

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release --no-pub \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: VOIDCORE-1.5.1-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
