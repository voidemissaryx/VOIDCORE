name: Deploy Supabase Edge Function

on:
  workflow_dispatch:
  push:
    branches:
      - default
    paths:
      - 'supabase/functions/admin-users/**'
      - '.github/workflows/deploy-supabase.yml'

permissions:
  contents: read

jobs:
  deploy-admin-users:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy admin-users function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          supabase functions deploy admin-users --project-ref fbbnyljizuddnyfslerv --yes
