# Builds and publishes split and universal APKs when a matching version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag must match pubspec.yaml. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS, and KEY_PASSWORD under GitHub Settings → Secrets and variables → Actions.
name: Release

on:
  push:
    branches:
      - default
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.4.0)'
        required: true
        type: string
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version and tag
        id: release
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          VERSION="${VERSION_INPUT#v}"
          if [[ -z "$VERSION" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$VERSION" ]]; then
            VERSION=$(awk -F'[ +]' '/^version:/ {print $2; exit}' pubspec.yaml)
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Invalid version format. Use X.Y or X.Y.Z (for example 1.5 or 1.5.0)"
            exit 1
          fi

          PUBSPEC_VERSION="$VERSION"
          if [[ "$PUBSPEC_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            PUBSPEC_VERSION="$PUBSPEC_VERSION.0"
          fi

          TAG=""
          for candidate in "$VERSION" "v$VERSION"; do
            if git ls-remote --exit-code --tags origin "refs/tags/$candidate" >/dev/null 2>&1; then
              TAG="$candidate"
              break
            fi
          done

          if [ -n "$TAG" ]; then
            echo "Tag $TAG already exists; building that exact tag without creating another."
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            echo "Keeping the workflow-dispatch branch commit $(git rev-parse --short HEAD) for this rebuild."

            TAG_VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
            echo "Building existing tag $TAG (tagged pubspec version: ${TAG_VERSION:-unknown}); the existing tag is authoritative."
            echo "EXISTING_TAG=true" >> "$GITHUB_ENV"
          else
            TAG="v$VERSION"
            echo "Tag $TAG does not exist; preparing a new release."
            BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
            BUILD_NUMBER=$((BUILD_NUMBER + 1))
            sed -i -E "s/^version:.*/version: ${PUBSPEC_VERSION}+${BUILD_NUMBER}/" pubspec.yaml

            echo "EXISTING_TAG=false" >> "$GITHUB_ENV"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pubspec.yaml
            git commit -m "chore: prepare release $VERSION"
            git tag "$TAG"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
            git push origin "$TAG"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Resolved release: $TAG"
          grep '^version:' pubspec.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Validate bundled scanner CIDRs
        working-directory: scanner
        run: go run ./cmd/normalize_scanner_cidrs --check ../assets/scanner

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Psiphon exit (built from source with the NDK)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: bash scripts/build_psiphon.sh

      - name: Tor and lyrebird (Tor Project's expert bundles, hash-checked)
        run: bash scripts/fetch_tor.sh

      - name: Xray core (built from xray/ with gomobile and the NDK)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: bash scripts/build_xray.sh

      - name: Free Go build cache before APK packaging
        run: |
          go clean -cache -modcache
          df -h /

      - name: Routing data (Chocolate4U/Iran-v2ray-rules, latest)
        run: bash scripts/fetch_geo.sh

      - name: Minify worker
        working-directory: worker
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run minify

      - name: Tor bridges for the setup wizard (fresh each build)
        run: bash scripts/fetch_tor_bridges.sh

      - run: flutter pub get --enforce-lockfile

      - run: flutter test --no-pub

      - name: Sign release APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

          mkdir -p android/keystore
          cleanup() {
            rm -f android/key.properties android/keystore/release.jks
          }
          trap cleanup EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/release.jks
          keytool -list -keystore android/keystore/release.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            printf 'storeFile=../keystore/release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          mkdir -p dist
          flutter build apk --release --split-per-abi --no-pub \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            if [ ! -s "$apk" ]; then
              echo "::error::Expected APK was not created: $apk"
              exit 1
            fi
            cp "$apk" "dist/voidcore-$VERSION-$abi.apk"
          done

          flutter build apk --release --no-pub \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          apk="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -s "$apk" ]; then
            echo "::error::Expected universal APK was not created: $apk"
            exit 1
          fi
          cp "$apk" "dist/voidcore-$VERSION-universal.apk"

      - name: Generate APK SHA-256 checksums
        run: sha256sum dist/voidcore-*.apk > dist/SHA256SUMS

      - name: Publish GitHub Release and create tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: VOIDCORE ${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          overwrite_files: true
          files: |
            dist/*.apk
            dist/SHA256SUMS
